# main への push で、サイトをビルドして Xserver（github.noraly-clary.com）へ配置する。
# 旧 GitHub Pages と同じビルダー（actions/jekyll-build-pages）を使うので、出力は Pages 時代と同じ。
#
# 必要なリポジトリシークレット（Settings → Secrets and variables → Actions）:
#   FTP_SERVER    例: sv17015.xserver.jp
#   FTP_USERNAME  github サブドメインのドキュメントルートに限定した FTP アカウント
#   FTP_PASSWORD
name: Deploy to Xserver

on:
  push:
    branches: [main]
  pull_request:        # PR ではビルドの確認だけ行い、配置はしない
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (GitHub Pages と同じ Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./_site
          include-hidden-files: true
          retention-days: 7

      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!k}" ]; then echo "::error::シークレット $k が未設定です"; exit 1; fi
          done

      - name: Upload to Xserver (FTPS)
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # 認証情報を平文で流さないよう FTPS を強制。--env-password でパスワードをコマンドラインに出さない。
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            mirror --reverse --verbose --no-perms ./_site/ ./;
            bye"
